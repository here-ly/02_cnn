# Kaggle 快速验证配置（仅用于 smoke test）
data:
  batch_size: 64
  num_workers: 2
  use_augmentation: false
  test_mode: true
  test:
    train_subset_size: 2000
    test_subset_size: 500

model:
  type: "SimpleCNN"
  input_channels: 3
  input_size: 32
  num_classes: 10
  conv_channels: [32, 64, 128]
  conv_kernels: [3, 3, 3]
  conv_paddings: [1, 1, 1]
  pool_size: 2
  fc_hidden: 256

optim:
  name: "adam"
  lr: 0.001
  lr_multiplier: 1
  betas: [0.9, 0.99]
  eps: 1.0e-6
  weight_decay: 0.0

train:
  epochs: 2
  log_interval: 10
  save_interval: 1
  save_heatmaps: false
  scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 100
    min_lr: 1.0e-7

seed: 42
